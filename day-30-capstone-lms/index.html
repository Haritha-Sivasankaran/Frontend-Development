    const delay = (ms: number) => new Promise((resolve) => setTimeout(resolve, ms));

    const storage = {
      getStudent(): Student | null {
        try {
          const d = localStorage.getItem('ednue_lms_student');
          return d ? JSON.parse(d) : DEFAULT_STUDENT;
        } catch {
          return DEFAULT_STUDENT;
        }
      },
      setStudent(s: Student) {
        localStorage.setItem('ednue_lms_student', JSON.stringify(s));
      },
      getEnrollments(): Enrollment[] {
        try {
          const d = localStorage.getItem('ednue_lms_enrollments');
          return d ? JSON.parse(d) : INITIAL_ENROLLMENTS;
        } catch {
          return INITIAL_ENROLLMENTS;
        }
      },
      setEnrollments(e: Enrollment[]) {
        localStorage.setItem('ednue_lms_enrollments', JSON.stringify(e));
      },
      getFavorites(): string[] {
        try {
          const d = localStorage.getItem('ednue_lms_favorites');
          return d ? JSON.parse(d) : ['course-101', 'course-103', 'course-105'];
        } catch {
          return ['course-101', 'course-103', 'course-105'];
        }
      },
      setFavorites(f: string[]) {
        localStorage.setItem('ednue_lms_favorites', JSON.stringify(f));

        const newStudent: Student = {
          id: `STU-${Math.floor(10000 + Math.random() * 90000)}`,

    function Badge({ variant = 'primary', children }: { variant?: string; children: React.ReactNode }) {

    }

    function ProgressBar({ progress }: { progress: number }) {
      const clamped = Math.min(Math.max(Math.round(progress), 0), 100);
      const isComplete = clamped === 100;
      return (
        <div className="progress-track-wrapper">
          <div className="progress-track-labels">
            <span>{isComplete ? 'Completed 🎉' : 'Course Progress'}</span>
            <span>{clamped}%</span>
          </div>
          <div className="progress-bar-bg">
            <div
              className={`progress-bar-fill ${isComplete ? 'completed' : ''}`}
              style={{ width: `${clamped}%` }}
            />
          </div>
        </div>
      );
    }

    function CourseList({ courses, enrolledCourseIds, favoriteCourseIds, onSelectCourse, onToggleFavorite, onEnroll }: any) {
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedLevel, setSelectedLevel] = useState('All');
      const [sortBy, setSortBy] = useState('popular');
      const [onlyFavorites, setOnlyFavorites] = useState(false);

      const filtered = useMemo(() => {
        return courses
          .filter((c: any) => {
            const matchesSearch =
              searchTerm.trim() === '' ||
              c.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
              c.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
              c.instructor.name.toLowerCase().includes(searchTerm.toLowerCase());
            const matchesCat = selectedCategory === 'All' || c.category === selectedCategory;
            const matchesLevel = selectedLevel === 'All' || c.level === selectedLevel;
            const matchesFav = !onlyFavorites || favoriteCourseIds.includes(c.id);
            return matchesSearch && matchesCat && matchesLevel && matchesFav;
          })
          .sort((a: any, b: any) => {
            if (sortBy === 'rating') return b.rating - a.rating;
            if (sortBy === 'price-low') return a.price - b.price;
            if (sortBy === 'price-high') return b.price - a.price;
            return b.reviewCount - a.reviewCount;
          });
      }, [courses, searchTerm, selectedCategory, selectedLevel, onlyFavorites, favoriteCourseIds, sortBy]);

      return (
        <div className="catalog-container">
          <div className="section-header">
            <div>
              <h2 className="section-title">Explore Academic &amp; Tech Programs</h2>
              <p className="section-subtitle">Accelerate your engineering abilities with real-world tracks.</p>
            </div>
            <div style={{ fontSize: '0.875rem', color: 'var(--gray-500)', fontWeight: 600 }}>
              Showing {filtered.length} of {courses.length} courses
            </div>
          </div>

          <div className="catalog-controls">
            <div className="catalog-search-row">
              <div className="search-input-wrapper">
                <span>🔍</span>
                <input
                  type="text"
                  className="search-input-field"
                  placeholder="Search by course title, topic, or mentor..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                />
              </div>

              <div className="filter-dropdowns">
                <select className="select-box" value={selectedLevel} onChange={(e) => setSelectedLevel(e.target.value)}>
                  <option value="All">All Levels</option>
                  <option value="Beginner">Beginner</option>
                  <option value="Intermediate">Intermediate</option>
                  <option value="Advanced">Advanced</option>
                </select>

                <select className="select-box" value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
                  <option value="popular">Most Popular</option>
                  <option value="rating">Highest Rated</option>
                  <option value="price-low">Price: Low to High</option>
                  <option value="price-high">Price: High to Low</option>
                </select>

                <button
                  className={`btn btn-sm ${onlyFavorites ? 'btn-primary' : 'btn-secondary'}`}
                  onClick={() => setOnlyFavorites(!onlyFavorites)}
                >
                  {onlyFavorites ? '❤️ Favorites Only' : '🤍 Favorites'}
                </button>
              </div>
            </div>

            <div className="category-pills-row">
              <button className={`category-pill ${selectedCategory === 'All' ? 'active' : ''}`} onClick={() => setSelectedCategory('All')}>
                All Tracks
              </button>
              {CATEGORIES.map((cat) => (
                <button key={cat} className={`category-pill ${selectedCategory === cat ? 'active' : ''}`} onClick={() => setSelectedCategory(cat)}>
                  {cat}
                </button>
              ))}
            </div>
          </div>

          {filtered.length > 0 ? (
            <div className="courses-grid">
              {filtered.map((course: any) => (
                <CourseCard
                  key={course.id}
                  course={course}
                  isEnrolled={enrolledCourseIds.includes(course.id)}
                  isFavorite={favoriteCourseIds.includes(course.id)}
                  onSelectCourse={onSelectCourse}
                  onToggleFavorite={onToggleFavorite}
                  onEnroll={onEnroll}
                />
              ))}
            </div>
          ) : (
            <div className="empty-state-card">
              <div className="empty-icon-lg">🔎</div>
              <h3>No Matching Courses Found</h3>
              <p style={{ color: 'var(--gray-500)', margin: '0.5rem auto 1.5rem', maxWidth: '400px' }}>
                Try adjusting your search filters or browse all tracks.
              </p>
              <button className="btn btn-primary" onClick={() => { setSearchTerm(''); setSelectedCategory('All'); setSelectedLevel('All'); }}>
                Reset Filters
              </button>
            </div>
          )}
        </div>
      );
    }

    function StudentForm({ onRegister }: any) {
      const [formData, setFormData] = useState({ name: '', email: '', phone: '', bio: '', interest: 'Web Development', githubUsername: '' });
      const [errors, setErrors] = useState<any>({});

      const handleSubmit = (e: any) => {
        e.preventDefault();
        const errs: any = {};
        if (!formData.name.trim() || formData.name.length < 3) errs.name = 'Full name (min 3 chars) is required.';
        if (!formData.email.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) errs.email = 'Valid email is required.';
        if (!formData.phone.trim()) errs.phone = 'Phone number is required.';
        if (!formData.bio.trim() || formData.bio.length < 10) errs.bio = 'Bio (min 10 chars) is required.';
        setErrors(errs);
        if (Object.keys(errs).length === 0) {
          onRegister(formData);
        }
      };

      return (
        <div className="form-card-container">
          <h2 className="form-header-title">Student Registration</h2>
          <p className="form-header-sub">Create your learner account to unlock syllabus checklists and verified certificates.</p>

          <form className="registration-form" onSubmit={handleSubmit}>
            <div className="input-group">
              <label className="input-label">Full Name <span>*</span></label>
              <input
                type="text"
                className={`text-input ${errors.name ? 'input-error' : ''}`}
                placeholder="e.g. Maya Lin"
                value={formData.name}
                onChange={(e) => setFormData({ ...formData, name: e.target.value })}
              />
              {errors.name && <span className="field-error-msg">⚠️ {errors.name}</span>}
            </div>

            <div className="form-grid-2">
              <div className="input-group">
                <label className="input-label">Email Address <span>*</span></label>
                <input
                  type="email"
                  className={`text-input ${errors.email ? 'input-error' : ''}`}
                  placeholder="maya@domain.com"
                  value={formData.email}
                  onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                />
                {errors.email && <span className="field-error-msg">⚠️ {errors.email}</span>}
              </div>

              <div className="input-group">
                <label className="input-label">Phone Number <span>*</span></label>
                <input
                  type="tel"
                  className={`text-input ${errors.phone ? 'input-error' : ''}`}
                  placeholder="+1 555-0199"
                  value={formData.phone}
                  onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                />
                {errors.phone && <span className="field-error-msg">⚠️ {errors.phone}</span>}
              </div>
            </div>

            <div className="form-grid-2">
              <div className="input-group">
                <label className="input-label">Track Interest</label>
                <select className="select-input" value={formData.interest} onChange={(e) => setFormData({ ...formData, interest: e.target.value as any })}>
                  {CATEGORIES.map((cat) => <option key={cat} value={cat}>{cat}</option>)}
                </select>
              </div>
              <div className="input-group">
                <label className="input-label">GitHub Username</label>
                <input
                  type="text"
                  className="text-input"
                  placeholder="octocat"
                  value={formData.githubUsername}
                  onChange={(e) => setFormData({ ...formData, githubUsername: e.target.value })}
                />
              </div>
            </div>

            <div className="input-group">
              <label className="input-label">Brief Bio <span>*</span></label>
              <textarea
                rows={3}
                className={`textarea-input ${errors.bio ? 'input-error' : ''}`}
                placeholder="Describe your technical learning goals..."
                value={formData.bio}
                onChange={(e) => setFormData({ ...formData, bio: e.target.value })}
              />
              {errors.bio && <span className="field-error-msg">⚠️ {errors.bio}</span>}
            </div>

            <button type="submit" className="btn btn-primary btn-lg" style={{ marginTop: '1rem' }}>
              🚀 Complete Registration
            </button>
          </form>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [selectedCourseId, setSelectedCourseId] = useState<string | null>(null);
      const [courses, setCourses] = useState<Course[]>([]);
      const [student, setStudent] = useState<Student | null>(null);
      const [enrollments, setEnrollments] = useState<Enrollment[]>([]);
      const [favorites, setFavorites] = useState<string[]>([]);
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState<string | null>(null);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [notification, setNotification] = useState<any>(null);

      useEffect(() => {
        let isMounted = true;
        setStudent(storage.getStudent());
        setEnrollments(storage.getEnrollments());
        setFavorites(storage.getFavorites());

        api.fetchCourses()
          .then((res) => {
            if (isMounted) {
              setCourses(res.data);
              setIsLoading(false);
            }
          })
          .catch((err) => {
            if (isMounted) {
              setError(err.message);
              setIsLoading(false);
            }
          });

        return () => { isMounted = false; };
      }, []);

      useEffect(() => {
        if (!notification) return;
        const timer = setTimeout(() => setNotification(null), 4000);
        return () => clearTimeout(timer);
      }, [notification]);

      const showToast = (message: string, type = 'success') => setNotification({ message, type });

      const handleNavigate = (tab: string) => {
        setActiveTab(tab);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleSelectCourse = (id: string) => {
        setSelectedCourseId(id);
        setActiveTab('details');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleEnroll = (courseId: string) => {
        const course = courses.find((c) => c.id === courseId);
        if (!course) return;

        if (enrollments.some((e) => e.courseId === courseId)) {
          showToast(`Already enrolled in "${course.title}".`, 'info');
          handleSelectCourse(courseId);
          return;
        }

        const newEnr: Enrollment = {
          courseId,
          enrolledAt: new Date().toISOString().split('T')[0],
          completedLessons: [],
          progress: 0,
          status: 'In Progress',
          lastAccessedAt: new Date().toISOString().split('T')[0]
        };

        const updated = [newEnr, ...enrollments];
        setEnrollments(updated);
        storage.setEnrollments(updated);
        showToast(`🎉 Enrolled in "${course.title}"!`, 'success');
      };

      const handleUnenroll = (courseId: string) => {
        const course = courses.find((c) => c.id === courseId);
        if (!window.confirm(`Unenroll from "${course?.title}"?`)) return;
        const updated = enrollments.filter((e) => e.courseId !== courseId);
        setEnrollments(updated);
        storage.setEnrollments(updated);
        showToast(`Unenrolled from "${course?.title}".`, 'info');
      };

      const handleToggleFavorite = (courseId: string) => {
        let updated: string[];
        if (favorites.includes(courseId)) {
          updated = favorites.filter((id) => id !== courseId);
          showToast('Removed from favorites.', 'info');
        } else {
          updated = [...favorites, courseId];
          showToast('Added to favorites! ❤️', 'success');
        }
        setFavorites(updated);
        storage.setFavorites(updated);
      };

      const handleToggleLesson = (courseId: string, lessonId: string) => {
        const course = courses.find((c) => c.id === courseId);
        if (!course) return;

        const enr = enrollments.find((e) => e.courseId === courseId);
        if (!enr) {
          handleEnroll(courseId);
          return;
        }

        const isDone = enr.completedLessons.includes(lessonId);
        const updatedLessons = isDone
          ? enr.completedLessons.filter((id) => id !== lessonId)
          : [...enr.completedLessons, lessonId];

        const newProgress = Math.round((updatedLessons.length / course.syllabus.length) * 100);
        const updatedEnr: Enrollment = {
          ...enr,
          completedLessons: updatedLessons,
          progress: newProgress,
          status: newProgress === 100 ? 'Completed' : 'In Progress',
          certificateIssued: newProgress === 100 ? true : enr.certificateIssued
        };

        const updatedAll = enrollments.map((e) => e.courseId === courseId ? updatedEnr : e);
        setEnrollments(updatedAll);
        storage.setEnrollments(updatedAll);

        if (newProgress === 100 && !enr.certificateIssued) {
          showToast(`🏆 Congratulations! You completed "${course.title}". Certificate unlocked!`, 'success');
        }
      };

      const handleRegisterStudent = async (data: any) => {
        const res = await api.registerStudent(data);
        setStudent(res.data);
        storage.setStudent(res.data);
        showToast(`Welcome, ${res.data.name}! Account created.`, 'success');
        setActiveTab('dashboard');
      };

      const handleUpdateProfile = (updated: Student) => {
        setStudent(updated);
        storage.setStudent(updated);
        showToast('Profile updated!', 'success');
      };

      const selectedCourse = courses.find((c) => c.id === selectedCourseId);
      const selectedEnrollment = enrollments.find((e) => e.courseId === selectedCourseId);

      return (
        <div className="app-root">
          <Navbar
            activeTab={activeTab}
            onNavigate={handleNavigate}
            enrolledCount={enrollments.length}
            favoritesCount={favorites.length}
            student={student}
            mobileMenuOpen={mobileMenuOpen}
            onToggleMobileMenu={() => setMobileMenuOpen(!mobileMenuOpen)}
          />

          <main className="main-wrapper">
            {isLoading && <LoadingSpinner message="Connecting to Ednue LMS..." />}

            {!isLoading && (
              <>
                {activeTab === 'home' && (
                  <Home
                    courses={courses}
                    enrolledCourseIds={enrollments.map((e) => e.courseId)}
                    favoriteCourseIds={favorites}
                    onNavigate={handleNavigate}
                    onSelectCourse={handleSelectCourse}
                    onToggleFavorite={handleToggleFavorite}
                    onEnroll={handleEnroll}
                  />
                )}

                {activeTab === 'courses' && (
                  <CourseList
                    courses={courses}
                    enrolledCourseIds={enrollments.map((e) => e.courseId)}
                    favoriteCourseIds={favorites}
                    onSelectCourse={handleSelectCourse}
                    onToggleFavorite={handleToggleFavorite}
                    onEnroll={handleEnroll}
                  />
                )}

                {activeTab === 'details' && selectedCourse && (
                  <CourseDetails
                    course={selectedCourse}
                    enrollment={selectedEnrollment}
                    isFavorite={favorites.includes(selectedCourse.id)}
                    onBack={() => setActiveTab('courses')}
                    onEnroll={handleEnroll}
                    onUnenroll={handleUnenroll}
                    onToggleFavorite={handleToggleFavorite}
                    onToggleLesson={handleToggleLesson}
                    onGoToDashboard={() => setActiveTab('dashboard')}
                  />
                )}

                {activeTab === 'dashboard' && (
                  <StudentDashboard
                    student={student}
                    courses={courses}
                    enrollments={enrollments}
                    onSelectCourse={handleSelectCourse}
                    onUnenroll={handleUnenroll}
                    onToggleLesson={handleToggleLesson}
                    onNavigate={handleNavigate}
                  />
                )}

                {activeTab === 'register' && (
                  <StudentForm onRegister={handleRegisterStudent} />
                )}

                {activeTab === 'profile' && student && (
                  <Profile
                    student={student}
                    courses={courses}
                    enrollments={enrollments}
                    onUpdateProfile={handleUpdateProfile}
                    onSelectCourse={handleSelectCourse}
                  />
                )}
              </>
            )}
          </main>

          {notification && (
            <div className="toast-container">
              <div className={`toast-item ${notification.type}`}>
                <span>{notification.message}</span>
                <button className="toast-close" onClick={() => setNotification(null)}>✕</button>
              </div>
            </div>
          )}

          <Footer onNavigate={handleNavigate} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root') as HTMLElement).render(<App />);
  </script>
</body>
</html>
